name: RimWorld Deployment Pipeline

on:
  push:
    branches:
      - "main"
      - "master"
  workflow_dispatch:
    inputs:
      release_chore:
        description: 'Release even if chore'
        type: boolean
        required: false
        default: false

jobs:
  deploy:
    uses: node/WorkshopMods/.forgejo/workflows/pipeline.yml@main
    secrets: inherit
    with:
      workshopId: "3526354009"
      release_chore: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_chore == 'true' }}
